name: Release

# Every pull request merged into main becomes a new Stint version: this bumps
# the version on main (patch 1.2.0 -> 1.2.1 by default; a "minor" label on the
# PR gives 1.3.0, "major" gives 2.0.0, "no release" skips it), tags it, builds
# the Windows installer and publishes "Stint vX.Y.Z" as the latest release,
# with notes listing the PRs merged since the previous version.
#
# The release also carries latest.json, which installed copies of Stint read to
# update themselves (Settings > Updates). The installer is signed with the key
# in the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# secrets; its public half is plugins.updater.pubkey in tauri.conf.json.
#
# No loops: the "Release vX.Y.Z" commit is pushed straight to main by the bot,
# not merged through a PR, so it never starts this workflow again.
on:
  # pull_request_target so the run has the secrets and a write token. It only
  # ever checks out main, never the PR's own code.
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  issues: write

# One release at a time. If several PRs are merged while one is building, the
# newest waiting run releases them all together (GitHub drops the older
# waiting runs), and its notes still list every PR.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    if: github.event.pull_request.merged && !contains(github.event.pull_request.labels.*.name, 'no release')
    runs-on: ubuntu-latest
    outputs:
      bump: ${{ steps.bump.outputs.bump }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Checked before anything is bumped, so a missing key leaves main alone.
      - name: Check the update signing key is set
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing, so the update can't be signed. See \"Updates\" in the README."
            exit 1
          fi
      # Makes sure the labels exist so they can be picked on the next PRs.
      - name: Create the version labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create minor --color c5b3f6 --description "Release as a minor version (1.2.0 -> 1.3.0)" 2>/dev/null || true
          gh label create major --color f6b3c9 --description "Release as a major version (1.2.0 -> 2.0.0)" 2>/dev/null || true
          gh label create "no release" --color d9d9d9 --description "Merge without publishing a new version" 2>/dev/null || true
      - id: bump
        name: Pick the bump from the PR's labels
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          bump=$(node -e '
            const labels = JSON.parse(process.env.LABELS);
            console.log(labels.includes("major") ? "major" : labels.includes("minor") ? "minor" : "patch");
          ')
          echo "Releasing a $bump version"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - run: npm run build

  bump:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      previous: ${{ steps.bump.outputs.previous }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - id: bump
        name: Bump version, commit and tag
        run: |
          set -euo pipefail
          version=$(node scripts/bump-version.mjs "${{ needs.test.outputs.bump }}")
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists."
            exit 1
          fi
          previous=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $tag"
          git tag "$tag"
          git push origin HEAD:main "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

  windows:
    needs: bump
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build and sign the installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - uses: actions/upload-artifact@v6
        with:
          name: stint-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig

  publish:
    needs: [bump, windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.bump.outputs.tag }}
      PREVIOUS: ${{ needs.bump.outputs.previous }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: stint-windows-installer
          path: installer
      - name: Publish release
        run: |
          set -euo pipefail
          exe=$(find installer -name '*.exe' | head -n 1)
          args=(--generate-notes --latest --verify-tag --title "Stint $TAG")
          if [ -n "$PREVIOUS" ]; then args+=(--notes-start-tag "$PREVIOUS"); fi
          gh release create "$TAG" "$exe" "${args[@]}"

          # What installed copies read to find this version. "latest" in the
          # updater's address only ever means a published release like this one,
          # never a PR test pre-release.
          name=$(basename "$exe")
          jq -n \
            --arg version "${TAG#v}" \
            --arg notes "$(gh release view "$TAG" --json body -q .body)" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat "$exe.sig")" \
            --arg url "https://github.com/$GH_REPO/releases/download/$TAG/$name" \
            '{version: $version, notes: $notes, pub_date: $date,
              platforms: {"windows-x86_64": {signature: $signature, url: $url}}}' > latest.json
          gh release upload "$TAG" latest.json
