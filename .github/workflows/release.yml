name: Release

# Every pull request merged into main starts a run, and each run ships everything
# merged since the last published version as one new Stint version: this bumps the
# version on main (patch 1.2.0 -> 1.2.1 by default; the highest label in the batch
# sets the bump, "minor" gives 1.3.0, "major" gives 2.0.0, and a "no release" PR
# doesn't count), tags it, builds the Windows installer and publishes "Stint vX.Y.Z"
# as the latest release, with notes listing the PRs merged since then.
# A run with nothing new stops without releasing.
#
# The release also carries latest.json, which installed copies of Stint read to
# update themselves (Settings > Updates). The installer is signed with the key
# in the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# secrets; its public half is plugins.updater.pubkey in tauri.conf.json.
#
# No loops: the "chore(release): vX.Y.Z" commit is pushed straight to main by the workflow,
# not merged through a PR, so it never starts this workflow again.
on:
  # pull_request_target so the run has the secrets and a write token. It only
  # ever checks out main, never the PR's own code.
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: read

# One release at a time. Every run waits its turn and, when it starts, releases
# everything on main since the last published version, so PRs merged close together
# go out as one version, and a run that finds nothing new stops. queue: max keeps
# every waiting run; without it GitHub keeps only one and cancels the rest.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  test:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    outputs:
      bump: ${{ steps.bump.outputs.bump }}
      previous: ${{ steps.bump.outputs.previous }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Checked before anything is bumped, so a missing key leaves main alone.
      - name: Check the update signing key is set
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing, so the update can't be signed. See \"Updates\" in the README."
            exit 1
          fi
      # Makes sure the labels exist so they can be picked on the next PRs.
      - name: Create the version labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create minor --color c5b3f6 --description "Release as a minor version (1.2.0 -> 1.3.0)" 2>/dev/null || true
          gh label create major --color f6b3c9 --description "Release as a major version (1.2.0 -> 2.0.0)" 2>/dev/null || true
          gh label create "no release" --color d9d9d9 --description "Merge without publishing a new version" 2>/dev/null || true
      # The commit this run tests is the one it releases, whatever lands on main later.
      - id: commit
        name: Remember the commit being tested
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: bump
        name: Pick the bump from the PRs in the batch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ steps.commit.outputs.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: node scripts/release-batch.mjs "$COMMIT" "$PR" >> "$GITHUB_OUTPUT"
      - if: steps.bump.outputs.bump != 'none'
        run: npm ci
      - if: steps.bump.outputs.bump != 'none'
        run: npm test
      - if: steps.bump.outputs.bump != 'none'
        run: npm run build

  bump:
    needs: test
    if: needs.test.outputs.bump != 'none'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      previous: ${{ needs.test.outputs.previous }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.test.outputs.sha }}
          fetch-depth: 0
      - id: bump
        name: Bump version, commit and tag
        run: |
          set -euo pipefail
          version=$(node scripts/bump-version.mjs "${{ needs.test.outputs.bump }}")
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists."
            exit 1
          fi
          git config user.name "Rachel G."
          git config user.email "rachel.galdino@proton.me"
          git commit -am "chore(release): $tag"
          git tag "$tag"
          # If a PR merged after the tested commit was taken, the tag stays on exactly
          # what was tested, main gets the release commit on top, and the newer PR goes
          # out in the next run. FETCH_HEAD because the remote-tracking ref may not
          # update. --atomic updates main and the tag together or not at all, so a
          # failed push can't leave a tag behind.
          git fetch origin main
          git rebase FETCH_HEAD
          git push --atomic origin HEAD:main "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  windows:
    needs: bump
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build and sign the installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - uses: actions/upload-artifact@v6
        with:
          name: stint-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig

  publish:
    needs: [bump, windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.bump.outputs.tag }}
      PREVIOUS: ${{ needs.bump.outputs.previous }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: stint-windows-installer
          path: installer
      - name: Publish release
        run: |
          set -euo pipefail
          exe=$(find installer -name '*.exe' | head -n 1)

          # Nothing is public until both files are up, so a failed run can simply
          # be re-run. Its draft is replaced here and its tag stays. A published
          # release is never touched, and gh's own check for one is skipped for a
          # draft, so this stops first.
          is_draft=$(gh release view "$TAG" --json isDraft -q .isDraft || true)
          if [ "$is_draft" = "true" ]; then
            gh release delete "$TAG" --yes
          elif [ "$is_draft" = "false" ]; then
            echo "::error::Release $TAG is already published."
            exit 1
          fi

          args=(--generate-notes --draft --verify-tag --title "Stint $TAG")
          if [ -n "$PREVIOUS" ]; then args+=(--notes-start-tag "$PREVIOUS"); fi
          gh release create "$TAG" "$exe" "${args[@]}"

          # What installed copies read to find this version. "latest" in the
          # updater's address only ever means a published release like this one,
          # never a PR test pre-release.
          name=$(basename "$exe")
          jq -n \
            --arg version "${TAG#v}" \
            --arg notes "$(gh release view "$TAG" --json body -q .body)" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat "$exe.sig")" \
            --arg url "https://github.com/$GH_REPO/releases/download/$TAG/$name" \
            '{version: $version, notes: $notes, pub_date: $date,
              platforms: {"windows-x86_64": {signature: $signature, url: $url}}}' > latest.json
          gh release upload "$TAG" latest.json

          # Installed copies update from the Latest release, so a late re-run of an
          # older version must not take it.
          newest=$({ gh release list --exclude-pre-releases --exclude-drafts --limit 20 --json tagName -q '.[].tagName'; echo "$TAG"; } | sort -V | tail -n 1)
          gh release edit "$TAG" --draft=false --latest="$([ "$newest" = "$TAG" ] && echo true || echo false)"
